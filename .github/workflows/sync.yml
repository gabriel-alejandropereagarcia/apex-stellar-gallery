name: Sync ecosystem data

on:
  schedule:
    - cron: "0 6 * * 1" # lunes 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone ecosystem dataset
        run: git clone --depth 1 https://github.com/lumenloop/stellar-ecosystem-db ../stellar-ecosystem-db

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Write GCP credentials (opcional)
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          mkdir -p secrets
          if [ -n "$GCP_SA_KEY" ]; then
            echo "$GCP_SA_KEY" > secrets/gcp-key.json
            echo "Key GCP escrita"
          else
            echo "GCP_SA_KEY no configurada — enrich:hubble se omitirá"
          fi

      - name: Ingest + public enrichers
        run: |
          npm run ingest
          npm run enrich
          npm run enrich:chain
          npm run enrich:dir

      - name: Enrich Hubble (si hay credenciales)
        run: |
          if [ -f secrets/gcp-key.json ]; then
            npm run enrich:hubble
          else
            echo "Sin secrets/gcp-key.json — skip"
          fi

      - name: Commit data updates
        run: |
          git config user.name "apex-data-bot"
          git config user.email "bot@users.noreply.github.com"
          git add src/data
          git diff --cached --quiet || git commit -m "chore(data): sync ecosystem snapshot"
          git push
